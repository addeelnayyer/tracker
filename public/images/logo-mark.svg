<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nasr">
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5a45"/>
      <stop offset="1" stop-color="#143d2f"/>
    </linearGradient>
  </defs>
  <!-- Seal -->
  <circle cx="32" cy="32" r="30" fill="url(#pine)"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#faf6ec" stroke-opacity="0.3" stroke-width="1.25"/>
  <!-- Ascending ledger bars -->
  <rect x="19" y="34" width="6" height="12" rx="3" fill="#faf6ec"/>
  <rect x="29" y="27" width="6" height="19" rx="3" fill="#faf6ec"/>
  <rect x="39" y="20" width="6" height="26" rx="3" fill="#faf6ec"/>
  <!-- Gold point (the "Nasr." period) -->
  <circle cx="42" cy="13.5" r="3.2" fill="#d9a441"/>
</svg>
