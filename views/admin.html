<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Tracker - Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Campaign Admin Panel</h1>
    <p style="color: #888; margin-bottom: 20px;">Please use the campaign URL to access your campaign's admin panel.</p>
    
    <div id="message" style="text-align: center;">
      <p>Redirecting...</p>
    </div>
  </div>

  <script>
    // This page redirects to the campaign view
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (slug) {
      window.location.href = `/campaign/${slug}`;
    } else {
      document.getElementById('message').innerHTML = '<p style="color: #e74c3c;">No campaign specified. <a href="/">Go back home</a></p>';
    }
  </script>
</body>
</html>
