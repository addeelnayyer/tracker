name: Deploy to Firebase

on:
  push:
    branches: [main]

# Prevent overlapping deploys; let an in-progress run finish.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore non-secret .env config
        run: printf '%s' '${{ secrets.FIREBASE_ENV_FILE }}' > .env

      - name: Authenticate to Google Cloud
        id: auth
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${RUNNER_TEMP}/gcp-sa-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-sa-key.json" >> "$GITHUB_ENV"
          # DIAG: validate the key file without leaking it
          python3 - "${RUNNER_TEMP}/gcp-sa-key.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1], 'rb').read()
          print("DIAG key bytes:", len(raw))
          d = json.loads(raw)
          print("DIAG type:", d.get("type"), "client_email:", d.get("client_email"), "key_id:", (d.get("private_key_id") or "")[:8])
          PY

      - name: Deploy to Firebase
        run: |
          # ponytail: pinned to 15.20.0 — the last release that authenticates via
          # GOOGLE_APPLICATION_CREDENTIALS in CI. 15.21.0+ broke it (firebase-tools#10726).
          # 15.20.0 is exactly what last deployed successfully (2026-06-16). Bump once fixed.
          pnpm dlx firebase-tools@15.20.0 deploy \
            --only functions,hosting,database,storage \
            --project addeelnayyer-nasrv0 \
            --non-interactive \
            --force \
            --debug

      - name: Clean up credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gcp-sa-key.json"
